[tool.poetry]
name = "visiowell-analysis"
version = "0.1.0"
description = "VisioWell analysis environment (statistical analysis, change-point detection, plotting)"
authors = ["Tiziana T."]
readme = "README.md"
package-mode = false
# packages = [{ include = "notebook" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
pandas = "2.3.3"
openpyxl = "3.1.5"
seaborn = "0.13.2"
statannotations = "0.7.2"
scikit-posthocs = "0.11.4"
ruptures = "1.1.10"
ipykernel = "7.1.0"
numpy = "2.1.2"
scipy = "1.15.3"
matplotlib = "3.10.7"
matplotlib-inline = "0.2.1"
statsmodels = "0.14.6"
streamlit = "1.65.0"
scikit-learn = "1.7.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"