[tool.poetry]
name = "visiowell-step0"
version = "0.1.0"
description = "VisioWell step0 environment (CZI preprocessing, well detection)"
authors = ["Tiziana T."]
readme = "README.md"
package-mode = false
# packages = [{ include = "visiowell_pipeline", from = "../../src" }]
 
[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "2.1.2"
scipy = "1.15.3"
matplotlib = "3.10.7"
opencv-python-headless = "4.12.0.88"
tifffile = "2025.5.10"
scikit-image = "0.25.2"
aicspylibczi = "3.3.1"
GPUtil = "1.4.0"
 
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
 

